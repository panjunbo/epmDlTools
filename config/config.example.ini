[serial]
log_port = COM1
log_baud = 500000
download_port = COM1
download_baud = 3000000
data_bits = 8
parity = none
stop_bits = 1
flush_timeout_ms = 100

[flashload]
comm_type = uart
flash_port_num = 0
target_baud = 3000000
sync_exit = false
rdelay = 0
erase_addr = 0x100000
erase_size = 0x100000
erase_load_addr = 0x100000
erase_load_size = 0x100000
flash_read_addr = 0x0
flash_read_size = 0x100000
xip_read = false

[programmer]
bin_addr = 0x50540000
bin_path = bin/programmer.bin

[crypt_crc]
src_crc_init = 0x1234
src_crc_poly = 0x3d65
src_crc_len = 2
src_crc_ref_in = 0
src_crc_ref_out = 1
src_crc_xor_out = 0xffff
dst_crc_init = 0
dst_crc_poly = 0x3d65

[bins]
default_dir =
default_chip = 9062
manual_path_programmer =
manual_path_bootloader =
manual_path_mcu_a =
manual_path_mcu_b =
manual_path_mcu_c =
manual_idlog_mcu_a =
manual_idlog_mcu_b =
manual_idlog_mcu_c =
selected_programmer = true
selected_bootloader = true
selected_mcu_a = true
selected_mcu_b = true
selected_mcu_c = true

[chip_9032]
programmer = programmer_9032, 0x08080000
bootloader = bootloader_packet_9032, 0x00
mcu_a = MCU_A, 0x20000
mcu_b = MCU_B, 0x100000

[chip_9062]
programmer = programmer_9062, 0x50060000
bootloader = bootloader_packet_9062, 0x00
mcu_a = MCU_A, 0x20000
mcu_b = MCU_B, 0x100000
mcu_c = bt_audio_dsp, 0x180000

[id_log]
mcu_a = idlog_MCU_A.bin
mcu_b = idlog_MCU_B.bin
mcu_c = idlog_MCU_C.bin
base_addr = 0x30000000

[ui]
theme = light
auto_scroll = true
recv_font_size = 10
; hpaned_sash_ratio / recv_send_sash_ratio 由关闭窗口时写入，勿手写占位默认值
window_geometry = 1840x930
find_history = id|a|c
find_case_sensitive = false

[presets]
name_1 = AT
mode_1 = ASCII
data_1 = AT
name_2 = ATE1
mode_2 = ASCII
data_2 = ATE1
name_3 = 查询版本
mode_3 = ASCII
data_3 = AT+VER
name_4 = 重启
mode_4 = ASCII
data_4 = AT+RST
name_5 = Ping
mode_5 = HEX
data_5 = AA 55 00 01
